{% extends "base.html" %}{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="card form-card shadow-sm"><div class="card-body p-4">
<h2 class="fw-bold">Student Registration</h2><p class="text-muted">Create your student account.</p>
<form method="post" class="row g-3">
<div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" required></div>
<div class="col-md-6"><label class="form-label">Roll number</label><input class="form-control" name="roll_no" required></div>
<div class="col-md-6"><label class="form-label">Branch</label><input class="form-control" name="branch" placeholder="CSE" required></div>
<div class="col-md-6"><label class="form-label">CGPA (0–10)</label><input class="form-control" type="number" min="0" max="10" step="0.01" name="cgpa" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="col-md-6"><label class="form-label">Username</label><input class="form-control" name="username" required></div>
<div class="col-md-12"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="6" required></div>
<div class="col-12"><button class="btn btn-primary">Register</button> <a class="btn btn-outline-secondary" href="{{ url_for('login') }}">Back to login</a></div>
</form></div></div>
{% endblock %}
