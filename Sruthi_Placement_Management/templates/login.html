{% extends "base.html" %}{% block title %}Login | Sruthi Placement{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card auth-card shadow-sm"><div class="card-body p-4 p-md-5">
  <h2 class="fw-bold mb-1">Welcome back</h2><p class="text-muted mb-4">Sign in to your placement account.</p>
  <form method="post">
    <label class="form-label">Username</label><input class="form-control mb-3" name="username" required>
    <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="text-center mt-3 mb-0">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
  <div class="small text-muted mt-4">First admin login: <b>admin</b> / <b>admin123</b></div>
</div></div></div>
{% endblock %}
